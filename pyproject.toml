[project]
name = "sciagram"
version = "0.0.2"
description = "easy and fun ASCII art generation!"
readme = "README.md"
authors = [
    { name = "Ishuman" }
]
requires-python = ">=3.13"
dependencies = [
    "pillow>=12.3.0",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[project.urls]
Homepage = "https://github.com/cosmognaut/sciagram"
Repository = "https://github.com/cosmognaut/sciagram"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[project.scripts]
sciagram = "sciagram.cli:main"
